apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-management-system
  labels:
    app.kubernetes.io/name: project-management-system
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: project-management-system-migrate
  labels:
    app.kubernetes.io/name: project-management-system
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-management-system
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: project-management-system
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.example.corp/project-management-system:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/node_modules/prisma/build/index.js", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: project-management-system-secrets
          env:
            - name: NODE_ENV
              value: production
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

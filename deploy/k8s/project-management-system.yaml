apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-management-system
  labels:
    app.kubernetes.io/name: project-management-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-management-system
  labels:
    app.kubernetes.io/name: project-management-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-management-system
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-management-system
    spec:
      serviceAccountName: project-management-system
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.example.corp/project-management-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: project-management-system-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: "--use-env-proxy --use-openssl-ca"
            - name: PORT
              value: "3000"
            - name: AUTH_COOKIE_SECURE
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: project-management-system
  labels:
    app.kubernetes.io/name: project-management-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: project-management-system
  ports:
    - name: http
      port: 80
      targetPort: http

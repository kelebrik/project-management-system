services:
  - type: web
    name: project-management-system
    runtime: node
    plan: free
    branch: main
    buildCommand: npm run render-build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: project-management-system-db
          property: connectionString
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false

databases:
  - name: project-management-system-db
    plan: free
    databaseName: project_management_system
    user: pms_user

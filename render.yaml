services:
  - type: web
    name: project-management-system
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm run render-build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_DEMO_MODE
        value: "false"
      - key: LOCAL_AUTH_EMAIL
        sync: false
      - key: LOCAL_AUTH_BOOTSTRAP_PASSWORD
        sync: false
      - key: PAGE_VISIT_RETENTION_DAYS
        value: "30"
      - key: METRICS_TOKEN
        sync: false
      - key: WEBHOOK_TIMEOUT_MS
        value: "5000"
      - key: WEBHOOK_MAX_ATTEMPTS
        value: "3"
      - key: WEBHOOK_RETRY_BASE_MS
        value: "500"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: project-management-system-db
          property: connectionString
      - key: JIRA_SPRINT_FIELD_ID
        value: customfield_10004

databases:
  - name: project-management-system-db
    plan: free
    databaseName: project_management_system
    user: pms_user

  <text class="text" x="276" y="204" font-size="42" font-weight="700">42</text>
  <text class="text muted s" x="358" y="204">8 критичных</text>
  <rect class="panel" x="500" y="124" width="228" height="112" rx="8"/>
  <text class="text h" x="520" y="154">On track</text>
  <text class="text" x="520" y="204" font-size="42" font-weight="700">61%</text>
  <circle class="green" cx="678" cy="188" r="12"/>
  <rect class="panel" x="744" y="124" width="228" height="112" rx="8"/>
  <text class="text h" x="764" y="154">Бюджет</text>
  <text class="text" x="764" y="204" font-size="32" font-weight="700">-4.8%</text>
  <text class="text muted s" x="848" y="204">прогноз</text>

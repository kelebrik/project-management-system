  <circle class="green" cx="840" cy="628" r="9"/><text class="text s" x="860" y="633">15.05 Архитектурный комитет</text>
  <circle class="amber" cx="978" cy="628" r="9"/><text class="text s" x="998" y="633">22.05 UAT старт</text>
  <circle class="red" cx="1116" cy="628" r="9"/><text class="text s" x="1136" y="633">30.05 Go/No-Go</text>
  <rect class="soft" x="792" y="672" width="428" height="70" rx="6"/>
  <text class="text s" x="812" y="702">Фильтры: портфель, владелец, статус, горизонт, бизнес-цель</text>
  <text class="text muted s" x="812" y="726">Клик по любому индикатору открывает первичные данные.</text>

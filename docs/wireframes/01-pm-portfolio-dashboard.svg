  <text class="text muted xs" x="512" y="344">RAG</text>
  <text class="text muted xs" x="598" y="344">Срок</text>
  <text class="text muted xs" x="690" y="344">Бюджет</text>
  <text class="text muted xs" x="784" y="344">Владелец</text>

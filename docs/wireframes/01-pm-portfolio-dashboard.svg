    <text x="282" y="424">Data platform</text><circle class="green" cx="522" cy="419" r="8"/><text x="598" y="424">0 дн.</text><text x="690" y="424">-2%</text><text x="784" y="424">Петрова</text>
    <text x="282" y="466">CRM migration</text><circle class="red" cx="522" cy="461" r="8"/><text x="598" y="466">+29 дн.</text><text x="690" y="466">+14%</text><text x="784" y="466">Смирнов</text>
    <text x="282" y="508">Mobile app</text><circle class="green" cx="522" cy="503" r="8"/><text x="598" y="508">-4 дн.</text><text x="690" y="508">0%</text><text x="784" y="508">Ким</text>
  </g>
  <rect class="panel" x="920" y="260" width="336" height="266" rx="8"/>

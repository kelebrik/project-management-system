  <rect class="soft" x="944" y="320" width="288" height="52" rx="6"/><text class="text s" x="960" y="350">Утвердить +2 аналитика для ERP</text>
  <rect class="soft" x="944" y="386" width="288" height="52" rx="6"/><text class="text s" x="960" y="416">Согласовать перенос релиза CRM</text>
  <rect class="soft" x="944" y="452" width="288" height="52" rx="6"/><text class="text s" x="960" y="482">Эскалация по поставщику интеграции</text>
  <rect class="panel" x="256" y="552" width="488" height="240" rx="8"/>
  <text class="text h" x="280" y="584">Динамика статуса</text>
  <polyline points="292,738 370,706 448,724 526,654 604,674 682,620" fill="none" stroke="#2563eb" stroke-width="4"/>
  <line class="line" x1="292" y1="746" x2="704" y2="746"/>
  <line class="line" x1="292" y1="614" x2="292" y2="746"/>

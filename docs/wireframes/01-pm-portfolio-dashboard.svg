<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840">
  <defs>
    <style>
      .bg{fill:#f6f7f9}.panel{fill:#fff;stroke:#d9dee7;stroke-width:1.5}.soft{fill:#eef2f7}.text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.muted{fill:#64748b}.title{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px}.xs{font-size:11px}.nav{fill:#202a36}.line{stroke:#d9dee7;stroke-width:1.5}.blue{fill:#2563eb}.green{fill:#16a34a}.amber{fill:#f59e0b}.red{fill:#dc2626}
    </style>
  </defs>
  <rect class="bg" width="1280" height="840"/>
  <rect class="nav" x="0" y="0" width="232" height="840"/>
  <text class="text" x="28" y="42" fill="#fff" font-size="20" font-weight="700">PM Front</text>
  <text class="text" x="28" y="86" fill="#cbd5e1" font-size="14">Портфели</text>
  <text class="text" x="28" y="122" fill="#94a3b8" font-size="14">Проекты</text>
  <text class="text" x="28" y="158" fill="#94a3b8" font-size="14">Задачи</text>
  <text class="text" x="28" y="194" fill="#94a3b8" font-size="14">Ресурсы</text>
  <text class="text" x="28" y="230" fill="#94a3b8" font-size="14">Риски и изменения</text>
  <text class="text" x="28" y="266" fill="#94a3b8" font-size="14">Overview для СЕО</text>
  <rect class="panel" x="256" y="24" width="1000" height="76" rx="8"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840">
  <defs><style>.bg{fill:#111827}.panel{fill:#fff;stroke:#d9dee7;stroke-width:1.5}.soft{fill:#eef2f7}.text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.light{font-family:Arial,Helvetica,sans-serif;fill:#f8fafc}.muted{fill:#64748b}.title{font-size:30px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px}.xs{font-size:11px}.line{stroke:#d9dee7;stroke-width:1}.green{fill:#16a34a}.amber{fill:#f59e0b}.red{fill:#dc2626}.blue{fill:#2563eb}</style></defs>
  <rect class="bg" width="1280" height="840"/>
  <text class="light" x="36" y="44" font-size="18" font-weight="700">Executive View</text>
  <text class="light" x="1100" y="44" font-size="13">13.05.2026 | v18</text>
  <rect class="panel" x="84" y="78" width="1112" height="690" rx="10"/>
  <text class="text title" x="128" y="132">ERP rollout: overview for Steering Committee</text>
  <circle class="amber" cx="1128" cy="118" r="18"/><text class="text" x="1060" y="156" font-size="16" font-weight="700">AT RISK</text>
  <rect class="soft" x="128" y="174" width="250" height="120" rx="8"/>
  <text class="text h" x="152" y="208">Краткий вывод</text>
  <text class="text s" x="152" y="240">Проект сохраняет бизнес-цель,</text>
  <text class="text s" x="152" y="262">но требует решения по API SLA.</text>
  <rect class="soft" x="404" y="174" width="250" height="120" rx="8"/>
  <text class="text h" x="428" y="208">Сроки</text>
  <text class="text" x="428" y="260" font-size="32" font-weight="700">+12 дн.</text>
  <rect class="soft" x="680" y="174" width="250" height="120" rx="8"/>
  <text class="text h" x="704" y="208">Бюджет</text>
  <text class="text" x="704" y="260" font-size="32" font-weight="700">+5.8%</text>
  <rect class="soft" x="956" y="174" width="196" height="120" rx="8"/>
  <text class="text h" x="980" y="208">Риски high</text>
  <text class="text" x="980" y="260" font-size="32" font-weight="700">3</text>
  <rect class="panel" x="128" y="326" width="504" height="258" rx="8"/>
  <text class="text h" x="152" y="360">Нужные решения</text>
  <text class="text s" x="152" y="404">1. Утвердить workaround обмена данными: +4.2 млн.</text>
  <text class="text s" x="152" y="440">2. Разрешить перенос UAT на 12 дней при отказе поставщика.</text>
  <text class="text s" x="152" y="476">3. Подтвердить приоритет ресурсов DevOps в мае.</text>
  <rect class="panel" x="660" y="326" width="492" height="258" rx="8"/>
  <text class="text h" x="684" y="360">Таймлайн вех</text>
  <line class="line" x1="702" y1="450" x2="1110" y2="450"/>
  <circle class="green" cx="732" cy="450" r="10"/><text class="text xs" x="704" y="488">15.05</text>
  <circle class="amber" cx="872" cy="450" r="10"/><text class="text xs" x="844" y="488">22.05</text>
  <circle class="red" cx="1012" cy="450" r="10"/><text class="text xs" x="984" y="488">30.05</text>
  <text class="text s" x="684" y="536">Клик по вехе открывает детали, но основной экран остается one-page.</text>
  <rect class="soft" x="128" y="612" width="1024" height="82" rx="8"/>
  <text class="text s" x="152" y="646">Источник данных: Gantt snapshot #223, реестр рисков #R-31/I-12, Finance actuals 12.05.2026.</text>
  <text class="text muted xs" x="152" y="674">Доступ: только Steering Committee. Все просмотры логируются. Экспорт: PDF/PPTX.</text>
  <text class="light" x="84" y="806" font-size="13">Навигация: ← → страницы, F полноэкранный режим, E evidence panel, D decision register</text>
</svg>

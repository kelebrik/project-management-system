<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840">
  <defs><style>.bg{fill:#f6f7f9}.panel{fill:#fff;stroke:#d9dee7;stroke-width:1.5}.soft{fill:#eef2f7}.text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.muted{fill:#64748b}.title{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px}.xs{font-size:11px}.line{stroke:#d9dee7;stroke-width:1}.green{fill:#16a34a}.amber{fill:#f59e0b}.red{fill:#dc2626}.blue{fill:#2563eb}</style></defs>
  <rect class="bg" width="1280" height="840"/>
  <rect class="panel" x="24" y="24" width="1232" height="70" rx="8"/>
  <text class="text title" x="48" y="58">Ресурсы и загрузка</text>
  <text class="text muted s" x="48" y="80">Матрица capacity vs demand, конфликт назначений, ставки, навыки, табели</text>
  <rect class="panel" x="24" y="118" width="360" height="674" rx="8"/>
  <text class="text h" x="48" y="150">Пул ресурсов</text>
  <line class="line" x1="48" y1="176" x2="360" y2="176"/>
  <text class="text s" x="48" y="214">Аналитики</text><rect class="soft" x="170" y="198" width="170" height="22" rx="4"/><rect class="blue" x="170" y="198" width="128" height="22" rx="4"/>
  <text class="text s" x="48" y="254">Разработчики</text><rect class="soft" x="170" y="238" width="170" height="22" rx="4"/><rect class="red" x="170" y="238" width="162" height="22" rx="4"/>
  <text class="text s" x="48" y="294">QA</text><rect class="soft" x="170" y="278" width="170" height="22" rx="4"/><rect class="amber" x="170" y="278" width="144" height="22" rx="4"/>
  <text class="text s" x="48" y="334">DevOps</text><rect class="soft" x="170" y="318" width="170" height="22" rx="4"/><rect class="green" x="170" y="318" width="90" height="22" rx="4"/>
  <line class="line" x1="48" y1="374" x2="360" y2="374"/>
  <text class="text h" x="48" y="410">Конфликты</text>
  <rect class="soft" x="48" y="432" width="292" height="56" rx="6"/><text class="text s" x="64" y="462">Dev Senior: 140% на 20-24 мая</text>
  <rect class="soft" x="48" y="504" width="292" height="56" rx="6"/><text class="text s" x="64" y="534">QA Lead: отпуск пересекается с UAT</text>
  <rect class="soft" x="48" y="576" width="292" height="56" rx="6"/><text class="text s" x="64" y="606">BA: дефицит 80 часов в июне</text>
  <rect class="panel" x="408" y="118" width="848" height="674" rx="8"/>
  <text class="text h" x="432" y="150">Тепловая карта загрузки</text>
  <g class="text muted xs">
    <text x="432" y="194">Ресурс</text><text x="610" y="194">13.05</text><text x="724" y="194">20.05</text><text x="838" y="194">27.05</text><text x="952" y="194">03.06</text><text x="1066" y="194">10.06</text>
  </g>
  <g class="text s">
    <text x="432" y="236">Иванова BA</text><rect class="green" x="610" y="216" width="88" height="28" rx="4"/><rect class="amber" x="724" y="216" width="88" height="28" rx="4"/><rect class="red" x="838" y="216" width="88" height="28" rx="4"/><rect class="amber" x="952" y="216" width="88" height="28" rx="4"/><rect class="green" x="1066" y="216" width="88" height="28" rx="4"/>
    <text x="432" y="292">Петров Dev</text><rect class="red" x="610" y="272" width="88" height="28" rx="4"/><rect class="red" x="724" y="272" width="88" height="28" rx="4"/><rect class="amber" x="838" y="272" width="88" height="28" rx="4"/><rect class="green" x="952" y="272" width="88" height="28" rx="4"/><rect class="green" x="1066" y="272" width="88" height="28" rx="4"/>
    <text x="432" y="348">Смирнов QA</text><rect class="green" x="610" y="328" width="88" height="28" rx="4"/><rect class="green" x="724" y="328" width="88" height="28" rx="4"/><rect class="amber" x="838" y="328" width="88" height="28" rx="4"/><rect class="red" x="952" y="328" width="88" height="28" rx="4"/><rect class="red" x="1066" y="328" width="88" height="28" rx="4"/>
  </g>
  <line class="line" x1="432" y1="394" x2="1232" y2="394"/>
  <text class="text h" x="432" y="430">Панель перераспределения</text>
  <rect class="soft" x="432" y="458" width="360" height="86" rx="6"/><text class="text s" x="452" y="492">Рекомендация: перенести задачу API tests на QA2</text><text class="text muted xs" x="452" y="520">Эффект: QA Lead 120% -> 95%</text>
  <rect class="soft" x="820" y="458" width="360" height="86" rx="6"/><text class="text s" x="840" y="492">Запрос ресурса: +1 backend на 2 недели</text><text class="text muted xs" x="840" y="520">Маршрут согласования: PM -> Resource manager</text>
  <text class="text muted s" x="432" y="724">Все назначения пересчитывают план, бюджет и executive overview.</text>
</svg>

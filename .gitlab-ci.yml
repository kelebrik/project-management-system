stages:
  - validate
  - test
  - build

variables:
  # Override PMS_CI_NODE_IMAGE in GitLab CI variables with an approved internal
  # registry image if the cluster blocks direct Docker Hub pulls.
  PMS_CI_NODE_IMAGE: "node:22-bookworm-slim"
  PMS_CI_NPM_VERSION: "10.8.2"
  PMS_CI_BUILDER_IMAGE: "$CI_REGISTRY_IMAGE/ci/image-builder:latest"
  PMS_CONTAINER_IMAGE: "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA"
  DATABASE_URL: "postgresql://pms_user:pms_password@localhost:5432/project_management_system?schema=public"
  AUTH_COOKIE_SECURE: "false"
  WEB_ORIGIN: "*"
  NPM_CONFIG_CACHE: "/tmp/pms-npm-cache"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  image:
    name: "$PMS_CI_NODE_IMAGE"
    pull_policy: if-not-present
    # Requires GitLab 18.0+ and GitLab Runner 17.11+.
    # If Sber Git uses an older version, move non-root securityContext to runner config.toml.
    kubernetes:
      user: "1000:1000"
  before_script:
    - node --version
    - scripts/ci-npm.sh --version
    - scripts/ci-install.sh
    - scripts/ci-npm.sh run prisma:generate

static-policy-check:
  stage: validate
  script:
    - scripts/ci-npm.sh run test:integration -- --test-name-pattern "Docker runtime|Operations shell|Backup and restore|Smoke scripts|Kubernetes|GitLab CI"

typecheck:
  stage: validate
  script:
    - scripts/ci-npm.sh run typecheck

unit-tests:
  stage: test
  script:
    - scripts/ci-npm.sh run test:unit

integration-contracts:
  stage: test
  script:
    - scripts/ci-npm.sh run test:integration

build:
  stage: build
  script:
    - scripts/ci-npm.sh run build
  artifacts:
    expire_in: 1 week
    paths:
      - apps/api/dist/
      - apps/web/dist/
      - packages/shared/dist/
      - prisma/
      - prisma.config.ts
      - package.json
      - package-lock.json
      - Dockerfile
      - deploy/k8s/

container-build:
  stage: build
  image:
    name: "$PMS_CI_BUILDER_IMAGE"
    entrypoint: [""]
    pull_policy: if-not-present
    # Requires GitLab 18.0+ and GitLab Runner 17.11+.
    # If Sber Git uses an older version, move non-root securityContext to runner config.toml.
    kubernetes:
      user: "1000:1000"
  rules:
    - if: '$ENABLE_CONTAINER_BUILD == "true"'
  needs:
    - build
  before_script: []
  script:
    - |
      if [ -z "${CORPORATE_IMAGE_BUILD_COMMAND:-}" ]; then
        echo "Set CORPORATE_IMAGE_BUILD_COMMAND in GitLab CI variables to the approved corporate image builder command."
        echo "Example: /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --build-arg NODE_IMAGE=$PMS_CI_NODE_IMAGE --destination $PMS_CONTAINER_IMAGE"
        exit 1
      fi
    - sh -lc "$CORPORATE_IMAGE_BUILD_COMMAND"

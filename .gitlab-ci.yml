stages:
  - check
  - build
  - approve
  - deploy

include:
  - project: "rnd/infra/gitlab-ci"
    ref: main
    file: "codeowners-template.yml"

.tokens: &tokens
  id_tokens:
    VAULT_ID_TOKEN:
      aud:
        - vault.dev.sberdevices.ru

variables:
  PMS_CI_NPM_VERSION: "10.8.2"
  NPM_CONFIG_CACHE: "/tmp/pms-npm-cache"
  NPM_CONFIG_REGISTRY: "https://nexus.sberdevices.ru/repository/npm"
  PRISMA_CLI_BINARY_TARGETS: "debian-openssl-3.0.x"
  PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
  PRISMA_ENGINES_BASE_URL: "https://git.sberdevices.ru/api/v4/projects/134759/packages/generic/debian_openssl/3.0.x"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  image:
    name: "docker.sberdevices.ru/skopeo/docker.io/node:24.16.0-bookworm-slim"
    pull_policy: if-not-present
    # Requires GitLab 18.0+ and GitLab Runner 17.11+.
    # If Sber Git uses an older version, move non-root securityContext to runner config.toml.
    kubernetes:
      user: "1000:1000"

.mr_to_master:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"

.node_job:
  extends: .mr_to_master
  stage: check
  before_script:
    - node --version
    - scripts/ci-npm.sh --version
    - scripts/ci-prisma-setup.sh bootstrap
    - scripts/ci-install.sh
    - scripts/ci-npm.sh run build --workspace @pms/shared
    - scripts/ci-prisma-setup.sh link-node-modules
    - scripts/ci-prisma-generate.sh

static-policy-check:
  extends: .node_job
  script:
    - scripts/ci-npm.sh run test:integration -- --test-name-pattern "Docker runtime|Operations shell|Backup and restore|Smoke scripts|Kubernetes|GitLab CI"

typecheck:
  extends: .node_job
  script:
    - scripts/ci-npm.sh run typecheck

unit-tests:
  extends: .node_job
  script:
    - scripts/ci-npm.sh run test:unit:ci
  coverage: '/Lines\s*:\s*([\d\.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - reports/junit-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage/cobertura-coverage.xml
    paths:
      - reports/

integration-contracts:
  extends: .node_job
  script:
    - scripts/ci-npm.sh run test:integration:ci
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - reports/junit-integration.xml
    paths:
      - reports/

build_image:
  stage: build
  rules:
    # merge-request event, just build is required
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    # push to master means that merge request was merged, build+push of images are required
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "master"
  tags:
    - buildah-std
  image: registry.sberdevices.ru/registry/tools/buildah/noenv:1.28.0
  before_script:
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" ${CI_REGISTRY}
  script:
    # increased ulimit otherwise buildah build fails with "too many open files"
    - |
      buildah build --ulimit nofile=65536:65536 \
        --build-arg CI_JOB_TOKEN="${CI_JOB_TOKEN}" \
        -t ${CI_REGISTRY_IMAGE} .
    - |
      if [[ "${CI_PIPELINE_SOURCE}" == "push" && "${CI_COMMIT_REF_NAME}" == "master" ]]; then
        echo "Pushing latest"
        buildah push ${CI_REGISTRY_IMAGE}
        echo "Pushing ${CI_COMMIT_SHORT_SHA}"
        buildah tag ${CI_REGISTRY_IMAGE} ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
        buildah push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
      else
        echo "Pushing test image: ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        buildah tag ${CI_REGISTRY_IMAGE} ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}
        buildah push ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}
      fi

.deploy_awx:
  <<: *tokens
  stage: deploy
  needs:
    - build_image
  tags:
    - kubernetes-std
  image: registry.sberdevices.ru/rnd/infra/docker_images/awx-cli:latest
  variables:
    PYTHONUNBUFFERED: "1"
    HYDRA_ENABLED: true
    HYDRA_VERSION: 4.0.3
    SBER_CA_BUNDLE: /tmp/sberdevices-ca/ca-bundle.crt
    SSL_CERT_DIR: /tmp/sberdevices-ca
    VAULT_ADDR: https://vault.dev.sberdevices.ru
    VAULT_AUTH_ROLE: starosfw-deploy
    VAULT_SECRET_PATH:
      starosfw/tuz_starosfw_glansbl
    GIT_STRATEGY: fetch
  hooks:
    pre_get_sources_script:
      - |
        set -eu
        cert_dir="$(dirname "${SBER_CA_BUNDLE}")"
        mkdir -p "${cert_dir}"
        : > "${SBER_CA_BUNDLE}"
        download_cert() {
          cert_name="$1"
          cert_path="${cert_dir}/${cert_name}"
          cert_url="https://cdp.sberdevices.ru/pki/${cert_name}"
          if command -v curl >/dev/null 2>&1; then
            curl --fail --show-error --location --insecure "${cert_url}" -o "${cert_path}"
          elif command -v wget >/dev/null 2>&1; then
            wget --no-check-certificate -qO "${cert_path}" "${cert_url}"
          else
            echo "curl or wget is required to download Sber CA certificates" >&2
            exit 1
          fi
          if ! grep -q "BEGIN CERTIFICATE" "${cert_path}"; then
            echo "Downloaded file is not a PEM certificate: ${cert_url}" >&2
            exit 1
          fi
          cat "${cert_path}" >> "${SBER_CA_BUNDLE}"
          printf '\n' >> "${SBER_CA_BUNDLE}"
        }
        for cert in rootca_ssl_rsa2022.crt subca_ssl_rsa2024.crt mincifra_rootca.crt mincifra_subca.crt SberDevices_RCA.crt SberDevices_ICA.crt; do
          download_cert "${cert}"
        done
        chmod 0644 "${SBER_CA_BUNDLE}" "${cert_dir}"/*.crt
        echo "Sber CA bundle contains $(grep -c "BEGIN CERTIFICATE" "${SBER_CA_BUNDLE}") certificates"
        for cert_path in "${cert_dir}"/*.crt; do
          openssl x509 -in "${cert_path}" -noout -subject >/dev/null
        done
  script:
    - |
      awx job_templates launch 378 \
        --conf.host "https://awx.rnd.dev.sberdevices.ru" \
        --conf.insecure \
        --conf.username "${USERNAME}" \
        --conf.password "${PASSWORD}" \
        --limit "${DEPLOY_LIMIT}" \
        --extra_vars "{\"tv_management_image\": \"registry.sberdevices.ru/rnd/infra/tv-project-management:${IMAGE_TAG}\"}" \
        --job_tags deploy_app \
        --monitor \
        --action-timeout 3600 \
        -f human \
        --conf.color true

deploy:
  extends: .deploy_awx
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "master"
  variables:
    IMAGE_TAG: latest
    DEPLOY_LIMIT: tvmanagement_prod

deploy:nt-01:
  extends: .deploy_awx
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
      when: manual
  variables:
    IMAGE_TAG: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    DEPLOY_LIMIT: tvmanagement_test

stages:
  - check
  - build
  - security
  # - security-reports
  - approve
  - deploy

include:
  - project: "rnd/infra/gitlab-ci"
    ref: main
    file: "codeowners-template.yml"

.tokens: &tokens
  id_tokens:
    VAULT_ID_TOKEN:
      aud:
        - vault.dev.sberdevices.ru

.vault_hydra: &vault_hydra
  HYDRA_ENABLED: true
  HYDRA_VERSION: 4.0.3
  VAULT_ADDR: https://vault.dev.sberdevices.ru
  VAULT_AUTH_ROLE: starosfw-deploy

.service_tuz_vault: &service_tuz_vault
  <<: *vault_hydra
  VAULT_SECRET_PATH: starosfw/tuz_starosfw_tvmngmt

.deploy_tuz_vault: &deploy_tuz_vault
  <<: *vault_hydra
  VAULT_SECRET_PATH: starosfw/tuz_starosfw_glansbl

variables:
  PMS_CI_NPM_VERSION: "10.8.2"
  NPM_CONFIG_CACHE: "/tmp/pms-npm-cache"
  NPM_CONFIG_REGISTRY: "https://nexus.sberdevices.ru/repository/npm"
  NPM_CONFIG_STRICT_SSL: "false"
  PRISMA_CLI_BINARY_TARGETS: "debian-openssl-3.0.x"
  PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
  PRISMA_ENGINES_BASE_URL: "https://git.sberdevices.ru/api/v4/projects/134759/packages/generic/debian_openssl/3.0.x"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  image:
    name: "docker.sberdevices.ru/skopeo/docker.io/node:24.16.0-bookworm-slim"
    pull_policy: if-not-present
    # Requires GitLab 18.0+ and GitLab Runner 17.11+.
    # If Sber Git uses an older version, move non-root securityContext to runner config.toml.
    kubernetes:
      user: "1000:1000"

.rule_mr_to_master: &rule_mr_to_master
  if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"

.rule_push_master: &rule_push_master
  if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "master"

.mr_to_master:
  rules:
    - <<: *rule_mr_to_master

.master_pipeline:
  rules:
    - <<: *rule_mr_to_master
    - <<: *rule_push_master

.node_job:
  extends: .mr_to_master
  stage: check
  before_script:
    - node --version
    - scripts/ci-npm.sh --version
    - scripts/ci-prisma-setup.sh bootstrap
    - scripts/ci-install.sh
    - scripts/ci-npm.sh run build --workspace @pms/shared
    - scripts/ci-prisma-setup.sh link-node-modules
    - scripts/ci-prisma-generate.sh

.reports_artifact: &reports_artifact
  when: always
  expire_in: 1 week
  paths:
    - reports/

static-policy-check:
  extends: .node_job
  script:
    - scripts/ci-npm.sh run test:integration -- --test-name-pattern "Docker runtime|Operations shell|Backup and restore|Smoke scripts|Kubernetes|GitLab CI"

typecheck:
  extends: .node_job
  script:
    - scripts/ci-npm.sh run typecheck

unit-tests:
  extends: .node_job
  script:
    - scripts/ci-npm.sh run test:unit:ci
  coverage: '/Lines\s*:\s*([\d\.]+)%/'
  artifacts:
    <<: *reports_artifact
    reports:
      junit:
        - reports/junit-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage/cobertura-coverage.xml

integration-contracts:
  extends: .node_job
  script:
    - scripts/ci-npm.sh run test:integration:ci
  artifacts:
    <<: *reports_artifact
    reports:
      junit:
        - reports/junit-integration.xml

.appsec_scan:
  extends: .master_pipeline
  stage: security
  needs: []
  tags:
    - kaniko-lrg

sast:
  <<: *tokens
  extends: .appsec_scan
  image: registry.sberdevices.ru/appsec-public/containers/sast:stable
  variables:
    <<: *service_tuz_vault
  script:
    - source /opt/sast.sh
  artifacts:
    paths:
      - sast-reports/*
    reports:
      sarif: sast-reports/codeql-javascript.sarif

sca:
  <<: *tokens
  extends: .appsec_scan
  image: registry.sberdevices.ru/appsec-public/containers/sca:stable
  variables:
    <<: *service_tuz_vault
  script:
    - source /opt/sca.sh
  artifacts:
    paths:
      - sca-reports/*

build_image:
  extends: .master_pipeline
  stage: build
  tags:
    - buildah-std
  image: registry.sberdevices.ru/registry/tools/buildah/noenv:1.28.0
  before_script:
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" ${CI_REGISTRY}
  script:
    # increased ulimit otherwise buildah build fails with "too many open files"
    - |
      buildah build --ulimit nofile=65536:65536 \
        --build-arg CI_JOB_TOKEN="${CI_JOB_TOKEN}" \
        -t ${CI_REGISTRY_IMAGE} .
    - |
      if [[ "${CI_PIPELINE_SOURCE}" == "push" && "${CI_COMMIT_REF_NAME}" == "master" ]]; then
        echo "Pushing latest"
        buildah push ${CI_REGISTRY_IMAGE}
        echo "Pushing ${CI_COMMIT_SHORT_SHA}"
        buildah tag ${CI_REGISTRY_IMAGE} ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
        buildah push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
      else
        echo "Pushing test image: ${CI_REGISTRY_IMAGE}:MR-${CI_MERGE_REQUEST_IID}"
        buildah tag ${CI_REGISTRY_IMAGE} ${CI_REGISTRY_IMAGE}:MR-${CI_MERGE_REQUEST_IID}
        buildah push ${CI_REGISTRY_IMAGE}:MR-${CI_MERGE_REQUEST_IID}
      fi

container-security:
  <<: *tokens
  extends: .appsec_scan
  tags:
    - kubernetes-std
  image: registry.sberdevices.ru/appsec-public/containers/container-security:stable
  variables:
    <<: *service_tuz_vault
  rules:
    - <<: *rule_mr_to_master
      variables:
        CLOUD_CONTAINER_SECURITY_IMAGE: "${CI_REGISTRY_IMAGE}:MR-${CI_MERGE_REQUEST_IID}"
    - <<: *rule_push_master
      variables:
        CLOUD_CONTAINER_SECURITY_IMAGE: "${CI_REGISTRY_IMAGE}:latest"
  when: always
  needs:
    - job: build_image
    - job: sast
    - job: sca

  script:
    - source /opt/container-security.sh
  artifacts:
    when: always
    paths:
      - container-security/*

.deploy_awx:
  <<: *tokens
  stage: deploy
  needs:
    - job: build_image
    - job: container-security
  tags:
    - kubernetes-std
  image: registry.sberdevices.ru/rnd/infra/docker_images/tools:latest
  variables:
    <<: *deploy_tuz_vault
    PYTHONUNBUFFERED: "1"
    GIT_STRATEGY: none
  script:
    - |
      awx job_templates launch 378 \
        --conf.host "https://awx.rnd.dev.sberdevices.ru" \
        --conf.insecure \
        --conf.username "${USERNAME}" \
        --conf.password "${PASSWORD}" \
        --limit "${DEPLOY_LIMIT}" \
        --extra_vars "{\"tv_management_image\": \"registry.sberdevices.ru/rnd/infra/tv-project-management:${IMAGE_TAG}\"}" \
        --job_tags deploy_app \
        --monitor \
        --action-timeout 3600 \
        -f human \
        --conf.color true

deploy:
  extends: .deploy_awx
  rules:
    - <<: *rule_push_master
  variables:
    IMAGE_TAG: latest
    DEPLOY_LIMIT: tvmanagement_prod

deploy:nt-01:
  extends: .deploy_awx
  rules:
    - <<: *rule_mr_to_master
      when: manual
  variables:
    IMAGE_TAG: MR-${CI_MERGE_REQUEST_IID}
    DEPLOY_LIMIT: tvmanagement_test

services:
  app:
    build:
      context: .
    image: project-management-system:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_ORIGIN: "*"
      AUTH_COOKIE_SECURE: "false"
      DATABASE_URL: postgresql://pms_user:pms_password@postgres:5432/project_management_system?schema=public
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_management_system
      POSTGRES_USER: pms_user
      POSTGRES_PASSWORD: pms_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_user -d project_management_system"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:

services:
  app:
    build:
      context: .
      args:
        CI_JOB_TOKEN: ${CI_JOB_TOKEN:-}
    image: project-management-system:local
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-5000}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-3}
      WEBHOOK_RETRY_BASE_MS: ${WEBHOOK_RETRY_BASE_MS:-500}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  migrate:
    image: project-management-system:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pms_user:pms_password@postgres:5432/project_management_system?schema=public
    command: ["npm", "run", "prisma:deploy"]
    restart: "no"

  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_management_system
      POSTGRES_USER: pms_user
      POSTGRES_PASSWORD: pms_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_user -d project_management_system"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pms_user:pms_password@postgres:5432/project_management_system
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup-db.sh"]

  restore:
    image: postgres:16-alpine
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pms_user:pms_password@postgres:5432/project_management_system
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-no}
      RESTORE_FILE: ${RESTORE_FILE:-}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-lc", "/scripts/restore-db.sh \"$RESTORE_FILE\""]

volumes:
  postgres-data:
